
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "Nama/path ZIP project (kosong = deteksi otomatis)"
        required: false
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Detect Project and Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Deteksi ZIP atau source langsung
      - name: Detect and Extract Android Project
        id: project
        shell: bash
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
        run: |
          python3 <<'PY'
          import os
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extract_dir = workspace / "_android_source"
          requested_zip = os.environ.get("PROJECT_ZIP", "").strip()

          ignored = {
              ".git", ".gradle", ".idea", "build",
              "node_modules", "__pycache__", "_android_source"
          }

          def valid_project(folder):
              settings = any(
                  (folder / name).is_file()
                  for name in (
                      "settings.gradle",
                      "settings.gradle.kts"
                  )
              )

              app_build = any(
                  (folder / "app" / name).is_file()
                  for name in (
                      "build.gradle",
                      "build.gradle.kts"
                  )
              )

              return settings and app_build

          def find_projects(root):
              found = []

              for current, dirs, files in os.walk(root):
                  dirs[:] = [
                      d for d in dirs
                      if d not in ignored and not d.startswith(".")
                  ]

                  folder = Path(current)

                  if valid_project(folder):
                      found.append(folder)

              return found

          selected_zip = None

          if requested_zip:
              candidate = (workspace / requested_zip).resolve()

              if workspace not in candidate.parents or not candidate.is_file():
                  raise SystemExit(
                      "ZIP tidak ditemukan atau path ZIP tidak valid: "
                      + requested_zip
                  )

              if candidate.suffix.lower() != ".zip":
                  raise SystemExit("File yang dipilih bukan ZIP.")

              selected_zip = candidate

          else:
              root_zips = sorted(
                  p for p in workspace.iterdir()
                  if p.is_file() and p.suffix.lower() == ".zip"
              )

              if len(root_zips) == 1:
                  selected_zip = root_zips[0]

              elif len(root_zips) > 1:
                  raise SystemExit(
                      "Ditemukan beberapa ZIP. Isi input project_zip "
                      "dengan nama ZIP yang ingin digunakan."
                  )

          if selected_zip:
              print("Mode: ZIP")
              print("ZIP:", selected_zip.name)

              extract_dir.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(selected_zip) as archive:
                  for item in archive.infolist():
                      name = item.filename.replace("\\", "/")
                      relative = PurePosixPath(name)

                      if relative.is_absolute() or ".." in relative.parts:
                          raise SystemExit(
                              "ZIP ditolak karena memiliki path tidak aman: "
                              + name
                          )

                      unix_mode = (item.external_attr >> 16) & 0o170000

                      if unix_mode == 0o120000:
                          raise SystemExit(
                              "ZIP ditolak karena mengandung symbolic link."
                          )

                      destination = (extract_dir / Path(*relative.parts)).resolve()

                      if destination != extract_dir and extract_dir not in destination.parents:
                          raise SystemExit("Path ZIP keluar dari folder ekstraksi.")

                      if item.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)

                          with archive.open(item) as source:
                              with open(destination, "wb") as target:
                                  while True:
                                      chunk = source.read(1024 * 1024)
                                      if not chunk:
                                          break
                                      target.write(chunk)

              search_root = extract_dir
              artifact_base = selected_zip.stem

          else:
              print("Mode: SOURCE LANGSUNG")
              search_root = workspace
              artifact_base = None

          projects = find_projects(search_root)

          if not projects:
              raise SystemExit(
                  "Project Android tidak ditemukan. Pastikan terdapat "
                  "settings.gradle(.kts) dan app/build.gradle(.kts)."
              )

          projects.sort(key=lambda p: (len(p.parts), str(p)))

          shallowest = len(projects[0].parts)
          matches = [p for p in projects if len(p.parts) == shallowest]

          if len(matches) > 1:
              print("Beberapa project Android ditemukan:")
              for p in matches:
                  print(" -", p)
              raise SystemExit(
                  "Project ambigu. Sisakan satu project atau atur isi ZIP."
              )

          project = matches[0]

          if artifact_base is None:
              artifact_base = project.name

          artifact_base = "".join(
              c if c.isalnum() or c in "-_." else "-"
              for c in artifact_base
          ).strip("-.")

          if not artifact_base:
              artifact_base = "android-project"

          relative_project = project.relative_to(workspace)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"project_dir={relative_project}\n")
              output.write(f"artifact_base={artifact_base}\n")

          print("Project ditemukan:", project)
          print("Nama artifact:", artifact_base)
          PY

      # 4. Siapkan Android SDK tanpa setup-android
      - name: Setup Android SDK
        id: android_sdk
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di Android SDK."
            echo "Periksa instalasi Android Command-line Tools runner."
            exit 1
          fi

          echo "Menggunakan sdkmanager: $SDKMANAGER"

          # Terima lisensi tanpa memasang paket SDK bernama 'tools'
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Deteksi compileSdk dan buildToolsVersion project
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          python3 - "$PROJECT_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          project = Path(sys.argv[1])
          files = [
              project / "app" / "build.gradle",
              project / "app" / "build.gradle.kts",
          ]

          compile_sdk = 35
          build_tools = "35.0.0"

          for file in files:
              if not file.is_file():
                  continue

              content = file.read_text(errors="ignore")

              match = re.search(
                  r'compileSdk(?:Version)?\s*(?:=|\()\s*(\d+)',
                  content
              )

              if match:
                  compile_sdk = int(match.group(1))

              match = re.search(
                  r'buildToolsVersion\s*(?:=)?\s*["\']([^"\']+)',
                  content
              )

              if match:
                  build_tools = match.group(1)

              break

          print(f"compileSdk={compile_sdk}")
          print(f"buildToolsVersion={build_tools}")

          with open("sdk_config.env", "w") as f:
              f.write(f"COMPILE_SDK={compile_sdk}\n")
              f.write(f"BUILD_TOOLS={build_tools}\n")
          PY

          source sdk_config.env

          echo "Memasang SDK yang diperlukan..."

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}"

          echo "SDK berhasil disiapkan."

      # 5. Siapkan Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 6. Build APK debug
      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory: $(pwd)"
          echo "Memeriksa file Gradle..."

          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          echo "Memulai build APK..."

          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo "Build APK selesai."

      # 7. Pastikan APK tersedia
      - name: Check APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Folder APK debug tidak ditemukan."
            exit 1
          fi

          find "$APK_DIR" -type f -name "*.apk" -print

          if ! find "$APK_DIR" -type f -name "*.apk" -print -quit | grep -q .; then
            echo "::error::APK tidak berhasil dibuat."
            exit 1
          fi

          echo "APK siap diunggah."

      # 8. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.project.outputs.artifact_base }}-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 30
